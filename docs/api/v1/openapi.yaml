openapi: 3.1.0
info:
  title: MissionApp API
  version: '1.0.0'
  description: >-
    Contrato da API do MissionApp (ADR-0027). Endpoints agrupados por domínio
    em arquivos separados sob docs/api/v1/<domínio>/openapi.yaml — este
    arquivo referencia cada domínio via $ref. Critério de domínio: o que o
    endpoint faz (mecanismo de sessão vs. atributo de recurso), não a tabela
    onde o dado é persistido. Ver seção "Critério de separação por domínio"
    na ADR-0027.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Prefixo da API

tags:
  - name: auth
    description: >-
      Ciclo de vida de autenticação e sessão — login, renovação de token,
      logout. Não expõe nem muta atributos de um recurso.
  - name: user
    description: >-
      Conta do usuário — cadastro, leitura de perfil, troca de senha. Mesmo
      quando o atributo é sensível (senha), a operação é sobre o recurso User.
  - name: missionary
    description: >-
      Perfil estendido de missionários — informações públicas, identidade e
      endereço de atuação.
  - name: media_asset
    description: >-
      Upload direto ao storage via URL pré-assinada e acompanhamento do
      processamento (validação e compressão em background) dos arquivos.
  - name: impact_project
    description: >-
      Projeto de impacto do missionário — vitrine principal da causa, com capa
      e vídeo opcional. Um por missionário.
  - name: post
    description: >-
      Postagens de missionários para o feed, com galeria de imagens sujeita ao
      limite rotativo de 50 imagens por missionário.

paths:
  /auth/login:
    $ref: './auth/openapi.yaml#/paths/~1auth~1login'
  /auth/forgot-password:
    $ref: './auth/openapi.yaml#/paths/~1auth~1forgot-password'
  /auth/reset-password:
    $ref: './auth/openapi.yaml#/paths/~1auth~1reset-password'
  /auth/refresh:
    $ref: './auth/openapi.yaml#/paths/~1auth~1refresh'
  /auth/logout:
    $ref: './auth/openapi.yaml#/paths/~1auth~1logout'
  /auth/sessions:
    $ref: './auth/openapi.yaml#/paths/~1auth~1sessions'
  /auth/sessions/{familyId}:
    $ref: './auth/openapi.yaml#/paths/~1auth~1sessions~1{familyId}'
  /accounts:
    $ref: './user/openapi.yaml#/paths/~1accounts'
  /accounts/username-availability:
    $ref: './user/openapi.yaml#/paths/~1accounts~1username-availability'
  /account/profile:
    $ref: './user/openapi.yaml#/paths/~1account~1profile'
  /account/password:
    $ref: './user/openapi.yaml#/paths/~1account~1password'
  /media-assets:
    $ref: './user/openapi.yaml#/paths/~1media-assets'
  /media-assets/uploads:
    $ref: './media_asset/openapi.yaml#/paths/~1media-assets~1uploads'
  /media-assets/{id}:
    $ref: './media_asset/openapi.yaml#/paths/~1media-assets~1{id}'
  /media-assets/{id}/completion:
    $ref: './media_asset/openapi.yaml#/paths/~1media-assets~1{id}~1completion'
  /impact-projects:
    $ref: './impact_project/openapi.yaml#/paths/~1impact-projects'
  /impact-projects/{id}:
    $ref: './impact_project/openapi.yaml#/paths/~1impact-projects~1{id}'
  /posts:
    $ref: './post/openapi.yaml#/paths/~1posts'
  /posts/{id}:
    $ref: './post/openapi.yaml#/paths/~1posts~1{id}'
  /missionaries/about:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1about'
  /missionaries/profile:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1profile'
  /missionaries/identity:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1identity'
  /missionaries/work-address:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1work-address'
  /missionaries/{id}/about:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1{id}~1about'
  /missionaries/{id}/profile:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1{id}~1profile'
  /missionaries/{id}/identity:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1{id}~1identity'
  /missionaries/{id}/work-address:
    $ref: './missionary/openapi.yaml#/paths/~1missionaries~1{id}~1work-address'
  /missionary-agencies:
    $ref: './missionary/openapi.yaml#/paths/~1missionary-agencies'
  /missionary-agencies/{id}:
    $ref: './missionary/openapi.yaml#/paths/~1missionary-agencies~1{id}'
  /faith-communities:
    $ref: './missionary/openapi.yaml#/paths/~1faith-communities'
  /faith-communities/{id}:
    $ref: './missionary/openapi.yaml#/paths/~1faith-communities~1{id}'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT de curta duração (15 min), emitido no login/refresh.
