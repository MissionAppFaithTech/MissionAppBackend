openapi: 3.1.0
info:
  title: MissionApp API
  version: 1.0.0
  description: 'Contrato da API do MissionApp (ADR-0027). Endpoints agrupados por domínio em arquivos separados sob docs/api/v1/<domínio>/openapi.yaml — este arquivo referencia cada domínio via $ref. Critério de domínio: o que o endpoint faz (mecanismo de sessão vs. atributo de recurso), não a tabela onde o dado é persistido. Ver seção "Critério de separação por domínio" na ADR-0027.'
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Prefixo da API
tags:
  - name: auth
    description: Ciclo de vida de autenticação e sessão — login, renovação de token, logout. Não expõe nem muta atributos de um recurso.
  - name: user
    description: Conta do usuário — cadastro, leitura de perfil, troca de senha. Mesmo quando o atributo é sensível (senha), a operação é sobre o recurso User.
  - name: missionary
    description: Perfil estendido de missionários — informações públicas, identidade e endereço de atuação.
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags:
        - auth
      summary: Login
      description: Autentica com login (email) e senha. Emite um access token JWT (15 min) e um refresh token opaco. Ambos sempre voltam no corpo da resposta — não há entrega via cookie nesta API, já que o consumidor web é um BFF (Next.js), não um browser. Ver ADR-0023, seção "Entrega de Tokens".
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/DeviceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Erro de validação do corpo da requisição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '423':
          description: Conta temporariamente bloqueada por excesso de tentativas de login falhadas. A mensagem informa quantos segundos faltam para o desbloqueio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags:
        - auth
      summary: Solicitar redefinição de senha
      description: Envia um email com link de redefinição de senha, se o login informado corresponder a um usuário cadastrado. Sempre responde 200 com a mesma mensagem genérica, exista ou não o email — evita user enumeration (não revela se um endereço está cadastrado). O link expira em 60 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Solicitação processada (independente de o email existir).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Erro de validação do corpo da requisição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /auth/reset-password:
    patch:
      operationId: authResetPassword
      tags:
        - auth
      summary: Redefinir senha
      description: Troca a senha mediante apresentação do token recebido por email. Revoga todas as sessões ativas e reseta o bloqueio de força bruta — apresentar o token é prova de controle sobre o email cadastrado. Ver ADR-0023.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Token inexistente ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Erro de validação do corpo da requisição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /auth/refresh:
    post:
      operationId: authRefresh
      tags:
        - auth
      summary: Renovação de access token
      description: Rotaciona o refresh token e emite um novo access token. O refresh token vai sempre no corpo — não há mais fallback via cookie. Reutilizar um refresh token já rotacionado invalida toda a família de tokens da sessão (detecção de roubo — ver ADR-0023). O TTL do novo refresh token é recalculado a partir de agora (sliding window).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Novo par de tokens emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token ausente, inválido, expirado ou já revogado (reuso detectado — toda a família foi invalidada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    delete:
      operationId: authLogout
      tags:
        - auth
      summary: Logout (dispositivo atual)
      description: |-
        Revoga a família de refresh token enviada no corpo — outras sessões do mesmo usuário não são afetadas. Para logout em todos os dispositivos, ver `DELETE /auth/sessions`.

        Não exige access token válido (RFC 7009 — endpoints de revogação não devem depender de credencial ainda ativa): a fonte primária de revogação é o refresh token, não o access token. Se o header `Authorization` vier com um access token ainda válido, seu `jti` também é bloqueado no DragonflyDB como defesa extra; ausente/expirado/ inválido não impede o logout. Resposta sempre 200, mesmo com refresh token desconhecido ou já revogado — idempotente, sem vazar validade do token. Ver ADR-0023.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logout realizado com sucesso (idempotente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Corpo da requisição inválido (refreshToken ausente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions:
    get:
      operationId: authSessionsIndex
      tags:
        - auth
      summary: Listar sessões ativas
      description: Lista as sessões (dispositivos) ativas do usuário autenticado — uma entrada por família de refresh token, ordenadas pela mais usada recentemente. `id` é o `family_id`, usado para revogar uma sessão específica em `DELETE /auth/sessions/{familyId}`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de sessões ativas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: authSessionsDestroyAll
      tags:
        - auth
      summary: Logout em todos os dispositivos
      description: 'Encerra todas as sessões do usuário: incrementa o `auth_version` (invalida instantaneamente todos os access tokens ativos, de todos os dispositivos) e revoga todos os refresh tokens. Ação explícita, distinta do logout comum. Ver ADR-0023.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas as sessões foram encerradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions/{familyId}:
    delete:
      operationId: authSessionsDestroy
      tags:
        - auth
      summary: Revogar sessão remota
      description: Revoga remotamente uma sessão/dispositivo específico, identificado pelo `id` retornado em `GET /auth/sessions`. O access token daquela sessão é rejeitado já na próxima requisição — via blocklist de família no DragonflyDB — sem esperar sua expiração natural de 15 minutos. Ver ADR-0023.
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sessão encerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sessão não encontrada, ou pertence a outro usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: familyId ausente ou não é um UUID válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accounts:
    post:
      operationId: accountSignup
      tags:
        - user
      summary: Cadastro de conta
      description: Cria um novo usuário e emite o par de tokens de autenticação, sempre no corpo da resposta — mesmo fluxo de entrega do login (ver ADR-0023).
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Conta criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: 'Erro de validação (ex: email já em uso, senhas não conferem).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /account/profile:
    get:
      operationId: accountProfileShow
      tags:
        - user
      summary: Perfil do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserSummary'
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: accountProfileUpdate
      tags:
        - user
      summary: Atualiza perfil do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '422':
          description: Erro de validação dos campos de perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /account/password:
    patch:
      operationId: accountPasswordUpdate
      tags:
        - user
      summary: Troca de senha
      description: 'Valida a senha atual, atualiza o hash e dispara revogação global: incrementa o auth_version do usuário (invalidando todos os access tokens ativos, incluindo o da própria requisição na próxima chamada) e revoga todos os refresh tokens. Ver ADR-0023.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Senha atual incorreta, ou nova senha/confirmação inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /media-assets:
    post:
      operationId: mediaAssetStore
      tags:
        - user
      summary: Registra metadata de um arquivo enviado ao storage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMediaAssetRequest'
      responses:
        '200':
          description: Media asset registrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
  /missionaries/about:
    patch:
      operationId: missionaryAboutUpdate
      tags:
        - missionary
      summary: Atualiza seção sobre do missionário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryAboutRequest'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryResponse'
        '403':
          description: Perfil sem permissão para editar dados missionários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /missionaries/profile:
    post:
      operationId: missionaryProfileStore
      tags:
        - missionary
      summary: Converte usuário autenticado para missionário
      description: Cria o perfil missionário para o usuário autenticado e altera seu role para MISSIONARY. Requer nova autenticação após a conversão para que os novos claims de role sejam refletidos no JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionaryProfileRequest'
      responses:
        '200':
          description: Perfil missionário criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  missionary:
                    $ref: '#/components/schemas/MissionaryResponse'
                  message:
                    type: string
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role sem permissão para conversão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agência missionária informada não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Usuário já possui perfil missionário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Erro de validação do corpo da requisição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

    patch:
      operationId: missionaryProfileUpdate
      tags:
        - missionary
      summary: Atualiza contatos públicos do missionário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryProfileRequest'
      responses:
        '200':
          description: Dados públicos atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryResponse'
  /missionaries/identity:
    patch:
      operationId: missionaryIdentityUpdate
      tags:
        - missionary
      summary: Atualiza dados de identidade do missionário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryIdentityRequest'
      responses:
        '200':
          description: Identidade atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryResponse'
  /missionaries/work-address:
    patch:
      operationId: missionaryWorkAddressUpdate
      tags:
        - missionary
      summary: Cria ou atualiza endereço de atuação do missionário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryWorkAddressRequest'
      responses:
        '200':
          description: Endereço de atuação atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryWorkAddressResponse'
  /missionaries/{id}/about:
    patch:
      operationId: missionaryAdminAboutUpdate
      tags:
        - missionary
      summary: Atualiza seção sobre de um missionário (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryAboutRequest'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryResponse'
  /missionaries/{id}/profile:
    patch:
      operationId: missionaryAdminProfileUpdate
      tags:
        - missionary
      summary: Atualiza contatos públicos de um missionário (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryProfileRequest'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryResponse'
  /missionaries/{id}/identity:
    patch:
      operationId: missionaryAdminIdentityUpdate
      tags:
        - missionary
      summary: Atualiza dados de identidade de um missionário (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryIdentityRequest'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryResponse'
  /missionaries/{id}/work-address:
    patch:
      operationId: missionaryAdminWorkAddressUpdate
      tags:
        - missionary
      summary: Cria ou atualiza endereço de atuação de um missionário (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryWorkAddressRequest'
      responses:
        '200':
          description: Endereço atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryWorkAddressResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT de curta duração (15 min), emitido no login/refresh.
  parameters:
    ClientType:
      name: x-client-type
      in: header
      required: false
      description: '`mobile` ou ausente (assume `web`). Não determina mais onde os tokens são entregues (sempre no corpo, em ambos os casos) — apenas a política de TTL do refresh token (sliding window mais longa para mobile) e o `deviceType` exibido em `GET /auth/sessions`.'
      schema:
        type: string
        enum:
          - mobile
    DeviceName:
      name: x-device-name
      in: header
      required: false
      description: 'Nome legível do dispositivo/cliente (ex: "iPhone 15", "Chrome no macOS"), exibido apenas em `GET /auth/sessions`.'
      schema:
        type: string
        maxLength: 120
    MissionaryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
            accessToken:
              type: string
              description: JWT — payload contém sub, jti, role, auth_version, fid (family_id do refresh token). TTL de 15 min.
            refreshToken:
              type: string
              description: Token opaco — sempre presente, para qualquer cliente.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              rule:
                type: string
              field:
                type: string
    ForgotPasswordRequest:
      type: object
      required:
        - login
      properties:
        login:
          type: string
          format: email
          maxLength: 254
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - newPasswordConfirmation
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    SessionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: family_id do refresh token — usado para revogar esta sessão.
        deviceType:
          type: string
          enum:
            - web
            - mobile
        deviceName:
          type:
            - string
            - 'null'
        ipAddress:
          type:
            - string
            - 'null'
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Se é a sessão do access token usado nesta requisição.
    SignupRequest:
      type: object
      required:
        - email
        - password
        - passwordConfirmation
      properties:
        fullName:
          type:
            - string
            - 'null'
        email:
          type: string
          format: email
          maxLength: 254
          description: Deve ser único — validado contra a tabela users.
        password:
          type: string
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-z0-9_]+$
        biography:
          type: string
          maxLength: 200
        profilePictureId:
          type: string
          format: uuid
    UserProfileResponse:
      type: object
      properties:
        data:
          type: object
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - newPasswordConfirmation
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
    RegisterMediaAssetRequest:
      type: object
      required:
