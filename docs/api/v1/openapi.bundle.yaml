              $ref: '#/components/schemas/PublicMissionaryProfile'

    MediaAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [S3, R2, GCS, AZURE]
        bucket:
          type: string
        fileKey:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
        purpose:
          type: [string, 'null']
          enum: [IMPACT_PROJECT_COVER, POST_IMAGE, PROFILE_PICTURE, null]
        status:
          type: string
          enum: [PENDING_UPLOAD, PROCESSING, READY, FAILED]
        url:
          type: [string, 'null']
          format: uri
          description: >-
            URL pública do arquivo no disco público do storage
            (`S3_ENDPOINT/<bucket>/<fileKey>` no MinIO, `R2_PUBLIC_URL/<fileKey>`
            no R2); `null` enquanto o status não for `READY`.
        createdAt:
          type: string
          format: date-time

    RequestMediaUploadRequest:
      type: object
      required: [purpose, mimeType, fileSizeBytes]
      properties:
        purpose:
          type: string
          enum: [IMPACT_PROJECT_COVER, POST_IMAGE, PROFILE_PICTURE]
          description: >-
            Finalidade do arquivo. Toda mídia enviada é imagem: todas as
            finalidades aceitam image/jpeg, image/png e image/webp, até 10 MB
            em `POST_IMAGE` e `IMPACT_PROJECT_COVER` e até 5 MB em
            `PROFILE_PICTURE`. O worker comprime para WebP (até 1600 px no maior
            lado em `POST_IMAGE`, 1920 px em `IMPACT_PROJECT_COVER` e 512 px em
            `PROFILE_PICTURE`). Vídeos não são enviados: o projeto de impacto
            guarda só o link (`videoUrl`).
        mimeType:
          type: string
          maxLength: 255
        fileSizeBytes:
          type: integer
          minimum: 1

    MediaUploadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            mediaAsset:
              $ref: '#/components/schemas/MediaAsset'
            upload:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                method:
                  type: string
                  enum: [PUT]
                headers:
                  type: object
                  description: Headers que devem ser enviados exatamente como estão no PUT.
                  properties:
                    Content-Type:
                      type: string
                    Content-Length:
                      type: string
                expiresAt:
                  type: string
                  format: date-time
    MediaAssetDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            mediaAsset:
              $ref: '#/components/schemas/MediaAsset'
    ImpactProject:
      type: object
      properties:
