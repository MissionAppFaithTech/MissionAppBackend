        '200':
          description: Página de projetos de impacto, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactProjectsResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Filtro inválido (`missionaryId` que não é UUID, `limit` acima de 20)
            ou cursor malformado. Códigos: `E_VALIDATION_ERROR`,
            `E_INVALID_CURSOR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    post:
      operationId: impactProjectStore
      tags: [impact_project]
      summary: Cria o projeto de impacto do missionário
      description: >-
        Cada missionário tem no máximo um projeto. Missionários criam o
        próprio projeto; ADMIN informa `missionaryId`. A capa deve ter sido
        enviada pelo próprio usuário autenticado via
        `POST /media-assets/uploads` e ter o upload confirmado. O vídeo não é
