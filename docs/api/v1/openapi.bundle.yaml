openapi: 3.1.0
info:
  title: MissionApp API
  version: 1.0.0
  description: 'Contrato da API do MissionApp (ADR-0027). Endpoints agrupados por domínio em arquivos separados sob docs/api/v1/<domínio>/openapi.yaml — este arquivo referencia cada domínio via $ref. Critério de domínio: o que o endpoint faz (mecanismo de sessão vs. atributo de recurso), não a tabela onde o dado é persistido. Ver seção "Critério de separação por domínio" na ADR-0027.'
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Prefixo da API
tags:
  - name: auth
    description: Ciclo de vida de autenticação e sessão — login, renovação de token, logout. Não expõe nem muta atributos de um recurso.
  - name: user
    description: Conta do usuário — cadastro, leitura de perfil, troca de senha. Mesmo quando o atributo é sensível (senha), a operação é sobre o recurso User.
  - name: missionary
    description: Perfil estendido de missionários — informações públicas, identidade e endereço de atuação.
  - name: media_asset
    description: Upload direto ao storage via URL pré-assinada e acompanhamento do processamento (validação e compressão em background) dos arquivos.
  - name: impact_project
    description: Projeto de impacto do missionário — vitrine principal da causa, com capa e link de vídeo opcional (YouTube ou Vimeo). Um por missionário.
  - name: post
    description: Postagens de missionários para o feed, com até 3 imagens por postagem e limite de 50 imagens por missionário (substituir as mais antigas exige confirmação).
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags:
        - auth
      summary: Login
      description: Autentica com login (email) e senha. Emite um access token JWT (15 min) e um refresh token opaco. Ambos sempre voltam no corpo da resposta — não há entrega via cookie nesta API, já que o consumidor web é um BFF (Next.js), não um browser. Ver ADR-0023, seção "Entrega de Tokens". Com `x-device-id`, há uma sessão por aparelho (ADR-0038) — as sessões ativas do mesmo usuário naquele aparelho são encerradas e seus access tokens deixam de valer. Sem o header, cada login abre uma sessão nova.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: >-
            Credenciais inválidas. Códigos: `E_INVALID_CREDENTIALS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação do corpo da requisição. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '423':
          description: >-
            Conta temporariamente bloqueada por excesso de tentativas de login
            falhadas. A mensagem informa quantos segundos faltam para o
            desbloqueio. Códigos: `E_ACCOUNT_LOCKED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags:
        - auth
      summary: Solicitar redefinição de senha
      description: Envia um email com link de redefinição de senha, se o login informado corresponder a um usuário cadastrado. Sempre responde 200 com a mesma mensagem genérica, exista ou não o email — evita user enumeration (não revela se um endereço está cadastrado). O link expira em 60 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Solicitação processada (independente de o email existir).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: >-
            Erro de validação do corpo da requisição. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /auth/reset-password:
    patch:
      operationId: authResetPassword
      tags:
        - auth
      summary: Redefinir senha
      description: Troca a senha mediante apresentação do token recebido por email. Revoga todas as sessões ativas e reseta o bloqueio de força bruta — apresentar o token é prova de controle sobre o email cadastrado. Ver ADR-0023.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: >-
            Token inexistente ou expirado. Códigos:
            `E_INVALID_PASSWORD_RESET_TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação do corpo da requisição. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /auth/refresh:
    post:
      operationId: authRefresh
      tags:
        - auth
      summary: Renovação de access token
      description: Rotaciona o refresh token e emite um novo access token. O refresh token vai sempre no corpo — não há mais fallback via cookie. A rotação é serializada por token e idempotente dentro da janela de tolerância (ADR-0035, padrão 30 s) — reapresentar um refresh token já rotacionado, do mesmo dispositivo (x-client-type, x-device-name e, quando os dois lados o têm, x-device-id), devolve o refresh token atual da sessão e um novo access token. Fora da janela, de outro dispositivo ou sem o registro da rotação, o reuso é tratado como roubo e invalida toda a família (ADR-0023). Reapresentar um token de sessão já encerrada (logout, troca de senha, revogação) responde 401 sem efeito. O TTL do novo refresh token é recalculado a partir de agora (sliding window).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Novo par de tokens emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: >-
            Refresh token inválido, expirado, de sessão encerrada ou reusado
            fora da janela de tolerância (`E_INVALID_REFRESH_TOKEN`; no último
            caso, toda a família foi invalidada). Códigos:
            `E_INVALID_REFRESH_TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '503':
          description: >-
            Não foi possível registrar a rotação na janela de tolerância
            (`E_REFRESH_UNAVAILABLE`). Nada foi alterado; tente de novo após
            `Retry-After`. Códigos: `E_REFRESH_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    delete:
      operationId: authLogout
      tags:
        - auth
      summary: Logout (dispositivo atual)
      description: |-
        Revoga a família de refresh token enviada no corpo — outras sessões do mesmo usuário não são afetadas. Para logout em todos os dispositivos, ver `DELETE /auth/sessions`.

        Não exige access token válido (RFC 7009 — endpoints de revogação não devem depender de credencial ainda ativa): a fonte primária de revogação é o refresh token, não o access token. Se o header `Authorization` vier com um access token ainda válido, seu `jti` também é bloqueado no DragonflyDB como defesa extra; ausente/expirado/ inválido não impede o logout. Resposta sempre 200, mesmo com refresh token desconhecido ou já revogado — idempotente, sem vazar validade do token. Ver ADR-0023.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logout realizado com sucesso (idempotente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: >-
            Corpo da requisição inválido (refreshToken ausente). Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /auth/sessions:
    get:
      operationId: authSessionsIndex
      tags:
        - auth
      summary: Listar sessões ativas
      description: Lista as sessões (dispositivos) ativas do usuário autenticado — uma entrada por família de refresh token, ordenadas pela mais usada recentemente. `id` é o `family_id`, usado para revogar uma sessão específica em `DELETE /auth/sessions/{familyId}`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de sessões ativas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: authSessionsDestroyAll
      tags:
        - auth
      summary: Logout em todos os dispositivos
      description: 'Encerra todas as sessões do usuário: incrementa o `auth_version` (invalida instantaneamente todos os access tokens ativos, de todos os dispositivos) e revoga todos os refresh tokens. Ação explícita, distinta do logout comum. Ver ADR-0023.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas as sessões foram encerradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions/{familyId}:
    delete:
      operationId: authSessionsDestroy
      tags:
        - auth
      summary: Revogar sessão remota
      description: Revoga remotamente uma sessão/dispositivo específico, identificado pelo `id` retornado em `GET /auth/sessions`. O access token daquela sessão é rejeitado já na próxima requisição — via blocklist de família no DragonflyDB — sem esperar sua expiração natural de 15 minutos. Ver ADR-0023.
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sessão encerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Sessão não encontrada, ou pertence a outro usuário. Códigos:
            `E_SESSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            familyId ausente ou não é um UUID válido. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /accounts:
    post:
      operationId: accountSignup
      tags:
        - user
      summary: Cadastro de conta
      description: Cria um novo usuário e emite o par de tokens de autenticação, sempre no corpo da resposta — mesmo fluxo de entrega do login (ver ADR-0023).
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Conta criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: >-
            Erro de validação (ex: email já em uso, senhas não conferem).
            Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /accounts/missionaries:
    post:
      operationId: accountMissionarySignup
      tags: [user]
      summary: Cadastro de missionário
      description: >-
        Cria, numa única transação, a conta já com role MISSIONARY e o perfil
        missionário, com os dados das três etapas do cadastro. Agência e
        comunidade de fé chegam como id de um item do catálogo ou como objeto
        para cadastrar um novo (registrado em nome do novo usuário; um item com
        o mesmo nome e cidade é reaproveitado). Qualquer falha desfaz tudo.
        Emite o par de tokens como o login (ADR-0023); o access token já sai
        com o role MISSIONARY. Rate limit de 10 cadastros por hora por IP.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionarySignupRequest'
      responses:
        '200':
          description: Conta e perfil missionário criados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionarySignupResponse'
        '422':
          description: >-
            Erro de validação (ex.: e-mail ou username em uso, agência ausente
            ou inexistente, data de nascimento futura). Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de cadastros por IP atingido; veja `Retry-After`. Códigos:
            `E_TOO_MANY_REQUESTS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accounts/username-availability:
    get:
      operationId: accountUsernameAvailability
      tags:
        - user
      summary: Verifica disponibilidade de nome de usuário
      description: Consulta pública usada durante o cadastro, antes de a conta existir. Quando o username já está em uso, sugere até 3 variações com sufixo numérico que ainda estão livres.
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: ^[a-z0-9_]+$
      responses:
        '200':
          description: Resultado da checagem de disponibilidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'
        '422':
          description: >-
            Nome de usuário fora do formato esperado. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de requisições atingido; veja `Retry-After`. Códigos:
            `E_TOO_MANY_REQUESTS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/profile:
    get:
      operationId: accountProfileShow
      tags:
        - user
      summary: Perfil do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: accountProfileUpdate
      tags:
        - user
      summary: Atualiza perfil do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação dos campos de perfil. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /account/password:
    patch:
      operationId: accountPasswordUpdate
      tags:
        - user
      summary: Troca de senha
      description: 'Valida a senha atual, atualiza o hash e dispara revogação global: incrementa o auth_version do usuário (invalidando todos os access tokens ativos, incluindo o da própria requisição na próxima chamada) e revoga todos os refresh tokens. Ver ADR-0023.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Senha atual incorreta, ou nova senha/confirmação inválidas. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /media-assets:
    post:
      operationId: mediaAssetStore
      tags:
        - user
      summary: Registra metadata de um arquivo enviado ao storage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMediaAssetRequest'
      responses:
        '200':
          description: Media asset registrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /media-assets/uploads:
    post:
      operationId: mediaUploadStore
      tags: [media_asset]
      summary: Solicita URL pré-assinada para upload direto ao storage
      description: >-
        Reserva um media asset em `PENDING_UPLOAD` e devolve uma URL pré-assinada
        (validade de 15 min) para o cliente enviar o arquivo direto ao storage
        com `PUT`. A chave no bucket é gerada pelo servidor. Os headers
        `Content-Type` e `Content-Length` fazem parte da assinatura: o envio
        precisa usar exatamente o tipo e o tamanho declarados, senão o storage
        rejeita. Depois do envio, o cliente confirma em
        `POST /media-assets/{id}/completion`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestMediaUploadRequest'
      responses:
        '200':
          description: Asset reservado e URL de upload emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação, ou mime type/tamanho não permitido para a
            finalidade informada (só image/jpeg, image/png e image/webp até
            10 MB). Códigos: `E_VALIDATION_ERROR`, `E_MEDIA_UPLOAD_NOT_ALLOWED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /media-assets/{id}:
    get:
      operationId: mediaAssetShow
      tags: [media_asset]
      summary: Exibe um media asset enviado pelo usuário autenticado
      description: >-
        Usado para acompanhar o processamento após a confirmação do upload:
        `PROCESSING` enquanto o worker valida/comprime, `READY` quando a `url`
        pública já está disponível e `FAILED` quando o conteúdo foi rejeitado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaAssetId'
      responses:
        '200':
          description: Media asset encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetDetailResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            O arquivo não foi enviado pelo usuário autenticado. Códigos:
            `E_MEDIA_ASSET_FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Media asset não encontrado. Códigos: `E_MEDIA_ASSET_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            O `id` informado não é um UUID válido. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /media-assets/{id}/completion:
    post:
      operationId: mediaUploadCompletionStore
      tags: [media_asset]
      summary: Confirma o upload e dispara validação e compressão
      description: >-
        Move o asset de `PENDING_UPLOAD` para `PROCESSING` e enfileira o
        processamento no worker. Imagens são redimensionadas (capa: até
        1920px; post: até 1600px no maior lado), convertidas para WebP e têm
        os metadados (EXIF/GPS) removidos. A partir de `PROCESSING` o asset já pode ser vinculado a um projeto ou
        post; a `url` fica disponível quando o status vira `READY`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaAssetId'
      responses:
        '202':
          description: Upload confirmado; processamento enfileirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetDetailResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
