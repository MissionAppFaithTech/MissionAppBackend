          type: string
        description:
          type: string
        missionaryId:
          type: string
          format: uuid
        coverImageAssetId:
          type: string
          format: uuid
        videoUrl:
          type: [string, 'null']
          format: uri
          description: >-
            Link de embed do vídeo (`https://www.youtube.com/embed/<id>` ou
            `https://player.vimeo.com/video/<id>`); `null` quando o projeto não
            tem vídeo.
        coverImage:
          $ref: '#/components/schemas/MediaAsset'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ImpactProjectResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            impactProject:
              $ref: '#/components/schemas/ImpactProject'
    ImpactProjectsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [impactProjects]
          properties:
            impactProjects:
              type: array
              items:
                $ref: '#/components/schemas/ImpactProject'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    CreateImpactProjectRequest:
      type: object
      required: [title, description, coverImageAssetId]
      properties:
        missionaryId:
          type: string
          format: uuid
          description: Obrigatório apenas para ADMIN; missionários criam o próprio projeto.
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 10000
        coverImageAssetId:
          type: string
          format: uuid
          description: Asset com finalidade `IMPACT_PROJECT_COVER`.
        videoUrl:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Link de um vídeo do YouTube (watch, youtu.be, shorts, embed, live) ou do
            Vimeo (direto, canal, grupo, showcase ou player; em vídeo não listado, o
            código de acesso é mantido como `?h=`) (RF 9.2), guardado no formato de
            embed. Outros endereços respondem 422 na regra `videoUrl`.
    UpdateImpactProjectRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 10000
        coverImageAssetId:
          type: string
          format: uuid
          description: >-
            Nova capa (`IMPACT_PROJECT_COVER`); a anterior é removida do storage
            de forma assíncrona.
        videoUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: >-
            Link de um vídeo do YouTube ou do Vimeo (RF 9.2), guardado no formato
            de embed; `null` remove o vídeo do projeto. Outros endereços
            respondem 422 na regra `videoUrl`.
