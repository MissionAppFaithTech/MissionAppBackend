            `E_FAITH_COMMUNITY_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /public/missionaries/{username}:
    get:
      operationId: publicMissionaryProfileShow
      tags:
        - missionary
      summary: Perfil público de missionário
      description: >-
        Consulta anônima, só leitura (RF 1.4, RF 10). Devolve apenas os campos
        públicos aprovados (ADR-0036): identificação, agência, comunidade de fé,
        aba Sobre, local de atuação (cidade/estado/país), contadores e contato
        público. Só missionários com perfil aprovado e conta ativa são visíveis;
        os demais respondem o mesmo 404. Rate limit de 60 consultas por minuto
        por IP; o servidor do BFF sem IP de usuário (renderização pública com
        cache) tem orçamento próprio de 600 por minuto.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          description: Username do missionário (maiúsculas são aceitas e normalizadas).
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[A-Za-z0-9_]+$'
      responses:
        '200':
          description: Perfil público encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMissionaryProfileResponse'
        '404':
          description: >-
            Perfil inexistente ou não público
            (`E_MISSIONARY_PROFILE_NOT_FOUND`). Códigos:
            `E_MISSIONARY_PROFILE_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Username com formato inválido (`E_VALIDATION_ERROR`). Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de consultas excedido (`E_TOO_MANY_REQUESTS`). Códigos:
            `E_TOO_MANY_REQUESTS`.
          headers:
            Retry-After:
              description: Segundos até a janela do rate limit expirar.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT de curta duração (15 min), emitido no login/refresh.
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: >-
        Cursor opaco da próxima página (`meta.nextCursor` da resposta anterior).
        Ausente = primeira página. Cursor malformado responde 422 `E_INVALID_CURSOR`
        (ADR-0033).
      schema:
        type: string
        maxLength: 512
    LimitParam:
      name: limit
      in: query
      required: false
      description: Itens por página; padrão 20, máximo 20 (NF 2.3, ADR-0033).
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
    ClientType:
      name: x-client-type
      in: header
      required: false
      description: '`mobile` ou ausente (assume `web`). Não determina mais onde os tokens são entregues (sempre no corpo, em ambos os casos) — apenas a política de TTL do refresh token (sliding window mais longa para mobile) e o `deviceType` exibido em `GET /auth/sessions`.'
      schema:
        type: string
        enum:
          - mobile
    DeviceName:
      name: x-device-name
      in: header
      required: false
      description: 'Nome legível do dispositivo/cliente (ex: "iPhone 15", "Chrome no macOS"), exibido apenas em `GET /auth/sessions`.'
      schema:
        type: string
        maxLength: 120
    DeviceId:
      name: x-device-id
      in: header
      required: false
      description: 'Identificador aleatório e estável do aparelho (ex.: cookie de dispositivo do BFF). Só o hash SHA-256 é guardado. No login, encerra as sessões ativas do mesmo usuário naquele aparelho (ADR-0038). No refresh, quando ausente, vale o do token anterior.'
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[\w-]+$
    DeviceKind:
      name: x-device-kind
      in: header
      required: false
      description: Tipo do aparelho, exibido em `GET /auth/sessions` (ADR-0038). Ausente no login vira `unknown`; no refresh, vale o do token anterior.
      schema:
        type: string
        enum:
          - desktop
          - mobile
          - tablet
          - unknown
    MissionaryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionaryAgencyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FaithCommunityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaAssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImpactProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CursorPaginationMeta:
      type: object
      description: >-
        Metadados de listas paginadas por cursor (ADR-0033). Sem `total`: contagens
        exibidas vêm de contadores desnormalizados no recurso pai.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Cursor da próxima página; `null` na última.
        hasMore:
          type: boolean
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          description: E.164
        biography:
          type: [string, 'null']
        birthDate:
          type: [string, 'null']
          format: date
          description: Informada no cadastro de missionário; null nas demais contas.
        profilePictureId:
          type: [string, 'null']
          format: uuid
        profilePictureUrl:
          type: [string, 'null']
          format: uri
          description: >-
            URL pública da foto de perfil; `null` sem foto ou enquanto ela ainda
            está sendo processada.
        role:
          type: string
          enum: [ADMIN, MISSIONARY, SUPPORTER]
          description: Cadastro público sempre cria SUPPORTER.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
            accessToken:
              type: string
              description: JWT — payload contém sub, jti, role, auth_version, fid (family_id do refresh token). TTL de 15 min.
            refreshToken:
              type: string
              description: Token opaco — sempre presente, para qualquer cliente.
    ErrorResponse:
      type: object
      description: >-
        Envelope único de erro (ADR-0034), igual em todos os ambientes. Clientes
        decidem pelo `code` (estável) e pelo status; `message` é só para humanos.
      required: [message, code]
      properties:
        message:
          type: string
          description: Texto em pt-BR para exibir ao usuário.
          example: Agência missionária não encontrada
        code:
          type: string
          pattern: '^E_[A-Z0-9_]+$'
          description: >-
            Identificador estável do erro. Cada resposta de erro documenta os
            códigos possíveis daquela operação ("Códigos: …"). Além deles,
            qualquer operação pode responder 500 `E_INTERNAL_SERVER_ERROR` e,
            com corpo, os erros do body parser (400 `E_BAD_REQUEST` para JSON
            malformado, 413 `E_REQUEST_ENTITY_TOO_LARGE`, 415
            `E_ENCODING_UNSUPPORTED`, 400 `E_REQUEST_ABORTED`). Rotas
            inexistentes respondem 404 `E_ROUTE_NOT_FOUND`. Renomear um code é
            breaking change.
          example: E_MISSIONARY_AGENCY_NOT_FOUND
        errors:
          type: array
          description: Só em erros de validação (422), um item por campo.
          items:
            type: object
            required: [field, rule, message]
            properties:
              field:
                type: string
              rule:
                type: string
              message:
                type: string
        meta:
          type: object
          description: Dados estruturados para o cliente reagir.
          properties:
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Segundos até poder tentar de novo (423 e 429; igual ao header Retry-After).
    ValidationErrorResponse:
      description: >-
        Envelope de erro de validação (422). `errors` traz um item por campo,
        tanto na validação de esquema (VineJS) quanto nas regras verificadas no
        service (ex.: username já em uso, `database.unique`; comunidade de fé ou
        foto inexistente, `database.exists`). Só um corpo que não é objeto JSON
        responde sem `errors`.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    ForgotPasswordRequest:
      type: object
      required:
        - login
      properties:
        login:
          type: string
          format: email
          maxLength: 254
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - newPasswordConfirmation
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    SessionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: family_id do refresh token — usado para revogar esta sessão.
        deviceType:
          type: string
          enum:
            - web
            - mobile
        deviceName:
          type:
            - string
            - 'null'
        deviceKind:
          type: string
          enum:
            - desktop
            - mobile
            - tablet
            - unknown
          description: Tipo do aparelho (`x-device-kind`); `unknown` quando não informado.
        ipAddress:
          type:
            - string
            - 'null'
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: Emissão do refresh token atual (última rotação).
        startedAt:
          type: string
          format: date-time
          description: Início da sessão (primeiro token da família).
        current:
          type: boolean
          description: Se é a sessão do access token usado nesta requisição.
    SignupRequest:
      type: object
      required:
        - email
        - password
        - passwordConfirmation
      properties:
        fullName:
          type:
            - string
            - 'null'
        email:
          type: string
          format: email
          maxLength: 254
          description: Deve ser único — validado contra a tabela users.
        password:
          type: string
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
    UsernameAvailabilityResponse:
      type: object
      properties:
        data:
          type: object
          required:
            - available
            - username
            - suggestions
          properties:
            available:
              type: boolean
            username:
              type: string
            suggestions:
              type: array
              items:
                type: string
              description: Até 3 variações livres, presente só quando available é false.
    UpdateProfileRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados. `biography` e
        `profilePictureId` aceitam `null` (ou string vazia) para ser limpos;
        `null` em `fullName` ou `username` é ignorado.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-z0-9_]+$'
        biography:
          type: [string, 'null']
          maxLength: 70
        profilePictureId:
          type: [string, 'null']
          format: uuid
          description: >-
            Asset `PROFILE_PICTURE` enviado pelo próprio usuário com upload
            confirmado (`POST /media-assets/uploads` e
            `POST /media-assets/{id}/completion`); caso contrário, 422 em
            `profilePictureId`. A foto anterior é removida do storage depois da
            troca ou da remoção.
    MissionarySignupRequest:
      type: object
      required:
        [fullName, username, phoneNumber, gender, email, password, passwordConfirmation, birthDate]
      description: >-
        Informe a agência por `missionaryAgencyId` ou por `missionaryAgency`
        (exatamente um) e, opcionalmente, a comunidade por `faithCommunityId`
        ou por `faithCommunity` (no máximo um).
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-z0-9_]+$'
        phoneNumber:
          type: string
          pattern: '^\\+[1-9]\\d{1,14}$'
        gender:
          type: string
          enum: [MALE, FEMALE]
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
        birthDate:
          type: string
          format: date
          description: Data passada no formato AAAA-MM-DD.
        identityType:
          type: string
          enum: [CPF, PASSPORT]
          description: Obrigatório junto com `identityDocument`.
        identityDocument:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Obrigatório junto com `identityType`. Salvo normalizado: CPF só com dígitos
            (11), passaporte em maiúsculas só com letras e números. Único por tipo:
            repetido responde 422 neste campo ("Este CPF já está cadastrado.").
        aboutMe:
          type: string
          maxLength: 5000
          description: Texto da seção Sobre (projeto ou atuação missionária).
        missionaryAgencyId:
          type: string
          format: uuid
        missionaryAgency:
          $ref: '#/components/schemas/CreateMissionaryAgencyRequest'
        faithCommunityId:
          type: string
          format: uuid
        faithCommunity:
          $ref: '#/components/schemas/CreateFaithCommunityRequest'
    MissionarySignupResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
            missionary:
              type: object
            workAddress:
              type: 'null'
              description: Sempre null no cadastro; o local de atuação é informado depois.
            missionaryAgency:
              $ref: '#/components/schemas/CatalogReference'
            faithCommunity:
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'
            accessToken:
              type: string
            refreshToken:
              type: string
    AccountProfileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
            missionary:
              type: [object, 'null']
              description: Perfil missionário do usuário; null quando ele não é missionário.
            workAddress:
              type: [object, 'null']
              description: Endereço de atuação do missionário; null quando não cadastrado.
            missionaryAgency:
              description: >-
                Agência missionária vinculada (id e nome), para exibir o nome sem
                consultar o catálogo público, que tem rate limit por IP. Null
                quando o usuário não é missionário.
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'
            faithCommunity:
              description: >-
                Comunidade de fé vinculada (id e nome). Null quando o usuário não
                é missionário ou não informou comunidade.
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'

    CatalogReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    UserProfileResponse:
      type: object
      properties:
        data:
          type: object
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - newPasswordConfirmation
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
    RegisterMediaAssetRequest:
      type: object
      required:
        - bucket
        - fileKey
        - mimeType
        - fileSizeBytes
      properties:
        provider:
          type: string
          enum:
            - S3
            - R2
            - GCS
            - AZURE
        bucket:
          type: string
          maxLength: 255
        fileKey:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 255
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 2147483647
    MediaAssetResponse:
      type: object
      properties:
        data:
          type: object
    UpdateMissionaryAboutRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados; `null` ou string
        vazia limpa o campo.
      properties:
        aboutMe:
          type:
            - string
            - 'null'
          maxLength: 5000
        missionStorySummary:
          type:
            - string
            - 'null'
          maxLength: 5000
        originLocation:
          type:
            - string
            - 'null'
          maxLength: 255
        faithCommunityId:
          type:
            - string
            - 'null'
          format: uuid
        missionaryAgencyId:
          type: string
          format: uuid
          description: Troca a agência missionária; não aceita limpar (`null` é ignorado).
        workAddress:
          description: >-
            Local de atuação. Substitui o endereço inteiro, com todos os campos
            obrigatórios (mesmas regras de `PATCH /missionaries/work-address`).
          allOf:
            - $ref: '#/components/schemas/UpdateMissionaryWorkAddressRequest'
        prayerRequest:
          type:
            - string
            - 'null'
          maxLength: 5000
        lifeVerse:
          type:
            - string
            - 'null'
          maxLength: 255
    MissionaryResponse:
      type: object
      properties:
        data:
          type: object
    CreateMissionaryProfileRequest:
      type: object
      required:
        - missionaryAgencyId
      properties:
        missionaryAgencyId:
          type: string
          format: uuid
    UpdateMissionaryProfileRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados; `null` ou string
        vazia limpa o campo.
      properties:
        publicEmail:
          type:
            - string
            - 'null'
          format: email
        publicPhone:
          type:
            - string
            - 'null'
          example: '+5511912345678'
        publicPhoneIsWhatsapp:
          type: boolean
          description: Indica se o telefone público aceita WhatsApp; o perfil só oferece WhatsApp quando true.
        donationMessage:
          type:
            - string
            - 'null'
          maxLength: 5000
    UpdateMissionaryIdentityRequest:
      type: object
      required:
        - identityType
        - identityDocument
      properties:
        identityType:
          type: string
          enum:
            - CPF
            - PASSPORT
        identityDocument:
          type: string
          maxLength: 50
          description: >-
            Salvo normalizado: CPF só com dígitos (11), passaporte em maiúsculas só com
            letras e números. Não pode ser o documento de outro missionário: responde 422
            neste campo ("Este CPF já está cadastrado.").
    UpdateMissionaryWorkAddressRequest:
      type: object
      required:
        - zip
        - district
        - city
        - state
        - country
      properties:
        zip:
          type: string
          maxLength: 20
        district:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        state:
          type: string
          maxLength: 255
        country:
          type: string
          maxLength: 255
    MissionaryWorkAddressResponse:
      type: object
      properties:
        data:
          type: object
    MissionaryAboutResponse:
      type: object
      description: Mesmo formato do perfil missionário em `GET /account/profile`.
      properties:
        data:
          type: object
          properties:
            missionary:
              type: object
            workAddress:
              type:
                - object
                - 'null'
              description: Local de atuação; null quando não cadastrado.
            missionaryAgency:
              $ref: '#/components/schemas/CatalogReference'
            faithCommunity:
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'
    MissionaryAgency:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneNumber:
          type:
            - string
            - 'null'
        addressLine1:
          type: [string, 'null']
        addressLine2:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        country:
          type: [string, 'null']
        postalCode:
          type: [string, 'null']
        website:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    MissionaryAgencyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            missionaryAgency:
              $ref: '#/components/schemas/MissionaryAgency'
    MissionaryAgenciesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            missionaryAgencies:
              type: array
              items:
                $ref: '#/components/schemas/MissionaryAgency'
        meta:
          type: object
          required: [hasMore]
          properties:
            hasMore:
              type: boolean
              description: Há mais itens além do `limit` para este termo.
    CreateMissionaryAgencyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          minLength: 1
          maxLength: 255
        country:
          type: string
          minLength: 1
          maxLength: 255
        postalCode:
          type: string
          minLength: 1
          maxLength: 32
        website:
          type: string
          format: uri
          maxLength: 255
    UpdateMissionaryAgencyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          minLength: 1
          maxLength: 255
        country:
          type: string
          minLength: 1
          maxLength: 255
        postalCode:
          type: string
          minLength: 1
          maxLength: 32
        website:
          type: string
          format: uri
          maxLength: 255
    FaithCommunity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneNumber:
          type: [string, 'null']
        addressLine1:
          type: [string, 'null']
