                $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    CreatePostRequest:
      type: object
      required: [content]
      properties:
        missionaryId:
          type: string
          format: uuid
          description: Obrigatório apenas para ADMIN; missionários publicam em nome próprio.
        content:
          type: string
          minLength: 1
          maxLength: 5000
        highlightLink:
          type: string
          format: uri
          maxLength: 255
        imageAssetIds:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Ids de assets `POST_IMAGE`, na ordem de exibição da galeria (até 3).
          items:
            type: string
            format: uuid
        replaceOldestImages:
          type: boolean
          description: >-
            Confirma substituir as imagens mais antigas do missionário quando a
            postagem ultrapassa o limite de 50 imagens (RF 8.2). Sem ela, a API
            responde 409 `E_POST_IMAGE_LIMIT_REACHED` e nada é gravado.
    UpdatePostRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
        highlightLink:
          type: [string, 'null']
          format: uri
          maxLength: 255
        imageAssetIds:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Substitui a galeria inteira, na ordem informada (até 3).
          items:
            type: string
            format: uuid
        replaceOldestImages:
          type: boolean
          description: >-
            Confirma substituir as imagens mais antigas do missionário quando as
            novas imagens ultrapassam o limite de 50 (RF 8.2). Sem ela, a API
            responde 409 `E_POST_IMAGE_LIMIT_REACHED` e nada é gravado.
