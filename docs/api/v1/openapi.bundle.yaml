    post:
      operationId: postStore
      tags:
        - post
      summary: Cria uma postagem
      description: Apenas missionários (ou ADMIN informando `missionaryId`) publicam. As imagens devem ter finalidade `POST_IMAGE`, ter sido enviadas pelo próprio usuário e ter o upload confirmado. **Limite rotativo:** cada missionário mantém no máximo 50 imagens somando todas as postagens. Ao ultrapassar, as imagens vinculadas há mais tempo são desvinculadas dos posts (o texto permanece) e os arquivos são removidos do storage de forma assíncrona.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
