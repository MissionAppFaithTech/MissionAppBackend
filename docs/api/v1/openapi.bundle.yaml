components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT de curta duração (15 min), emitido no login/refresh.
  parameters:
    ClientType:
      name: x-client-type
      in: header
      required: false
      description: '`mobile` ou ausente (assume `web`). Não determina mais onde os tokens são entregues (sempre no corpo, em ambos os casos) — apenas a política de TTL do refresh token (sliding window mais longa para mobile) e o `deviceType` exibido em `GET /auth/sessions`.'
      schema:
        type: string
        enum:
          - mobile
    DeviceName:
      name: x-device-name
      in: header
      required: false
      description: 'Nome legível do dispositivo/cliente (ex: "iPhone 15", "Chrome no macOS"), exibido apenas em `GET /auth/sessions`.'
      schema:
        type: string
        maxLength: 120
    MediaAssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ImpactProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionaryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionaryAgencyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FaithCommunityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        createdAt:
