  /public/missionaries/{username}:
    get:
      operationId: publicMissionaryProfileShow
      tags:
        - missionary
      summary: Perfil público de missionário
      description: >-
        Consulta anônima, só leitura (RF 1.4, RF 10). Devolve apenas os campos
        públicos aprovados (ADR-0036): identificação, agência, comunidade de fé,
        aba Sobre, local de atuação (cidade/estado/país), contadores e contato
        público. Só missionários com perfil aprovado e conta ativa são visíveis;
        os demais respondem o mesmo 404. Rate limit de 60 consultas por minuto
        por IP; o servidor do BFF sem IP de usuário (renderização pública com
        cache) tem orçamento próprio de 600 por minuto.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          description: Username do missionário (maiúsculas são aceitas e normalizadas).
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[A-Za-z0-9_]+$'
      responses:
        '200':
          description: Perfil público encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMissionaryProfileResponse'
        '404':
          description: Perfil inexistente ou não público (`E_MISSIONARY_PROFILE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Username com formato inválido (`E_VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de consultas excedido (`E_TOO_MANY_REQUESTS`).
          headers:
            Retry-After:
              description: Segundos até a janela do rate limit expirar.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT de curta duração (15 min), emitido no login/refresh.
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: >-
        Cursor opaco da próxima página (`meta.nextCursor` da resposta anterior).
        Ausente = primeira página. Cursor malformado responde 422 `E_INVALID_CURSOR`
        (ADR-0033).
      schema:
        type: string
        maxLength: 512
    LimitParam:
      name: limit
      in: query
      required: false
      description: Itens por página; padrão 20, máximo 20 (NF 2.3, ADR-0033).
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
    ClientType:
      name: x-client-type
      in: header
      required: false
      description: '`mobile` ou ausente (assume `web`). Não determina mais onde os tokens são entregues (sempre no corpo, em ambos os casos) — apenas a política de TTL do refresh token (sliding window mais longa para mobile) e o `deviceType` exibido em `GET /auth/sessions`.'
      schema:
        type: string
        enum:
          - mobile
    DeviceName:
      name: x-device-name
      in: header
      required: false
      description: 'Nome legível do dispositivo/cliente (ex: "iPhone 15", "Chrome no macOS"), exibido apenas em `GET /auth/sessions`.'
      schema:
        type: string
        maxLength: 120
    MissionaryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionaryAgencyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FaithCommunityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CursorPaginationMeta:
      type: object
      description: >-
        Metadados de listas paginadas por cursor (ADR-0033). Sem `total`: contagens
        exibidas vêm de contadores desnormalizados no recurso pai.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Cursor da próxima página; `null` na última.
        hasMore:
          type: boolean
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          description: E.164
        biography:
          type: [string, 'null']
        profilePictureId:
          type: [string, 'null']
          format: uuid
        role:
          type: string
          enum: [ADMIN, MISSIONARY, SUPPORTER]
          description: Cadastro público sempre cria SUPPORTER.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
            accessToken:
              type: string
              description: JWT — payload contém sub, jti, role, auth_version, fid (family_id do refresh token). TTL de 15 min.
            refreshToken:
              type: string
              description: Token opaco — sempre presente, para qualquer cliente.
    ErrorResponse:
      type: object
      description: >-
        Envelope único de erro (ADR-0034), igual em todos os ambientes. Clientes
        decidem pelo `code` (estável) e pelo status; `message` é só para humanos.
      required: [message, code]
      properties:
        message:
          type: string
          description: Texto em pt-BR para exibir ao usuário.
          example: Agência missionária não encontrada
        code:
          type: string
          pattern: '^E_[A-Z0-9_]+$'
          description: >-
            Identificador estável do erro. Exemplos: E_VALIDATION_ERROR,
            E_UNAUTHORIZED_ACCESS, E_INVALID_CREDENTIALS, E_ACCOUNT_LOCKED,
            E_INVALID_REFRESH_TOKEN, E_SESSION_NOT_FOUND, E_TOO_MANY_REQUESTS,
            E_ROUTE_NOT_FOUND, E_ROW_NOT_FOUND, E_MISSIONARY_*, E_FAITH_COMMUNITY_*,
            E_INTERNAL_SERVER_ERROR. Renomear um code é breaking change.
          example: E_MISSIONARY_AGENCY_NOT_FOUND
        errors:
          type: array
          description: Só em erros de validação (422), um item por campo.
          items:
            type: object
            required: [field, rule, message]
            properties:
              field:
                type: string
              rule:
                type: string
              message:
                type: string
        meta:
          type: object
          description: Dados estruturados para o cliente reagir.
          properties:
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Segundos até poder tentar de novo (423 e 429; igual ao header Retry-After).
    ValidationErrorResponse:
      description: >-
        Envelope de erro de validação (422). `errors` vem por campo quando a
        validação é de esquema (VineJS); regras de negócio verificadas no service
        (ex.: username já em uso) respondem só com `message` e `code`.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    ForgotPasswordRequest:
      type: object
      required:
        - login
      properties:
        login:
          type: string
          format: email
          maxLength: 254
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - newPasswordConfirmation
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    SessionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: family_id do refresh token — usado para revogar esta sessão.
        deviceType:
          type: string
          enum:
            - web
            - mobile
        deviceName:
          type:
            - string
            - 'null'
        ipAddress:
          type:
            - string
            - 'null'
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Se é a sessão do access token usado nesta requisição.
    SignupRequest:
      type: object
      required:
        - email
        - password
        - passwordConfirmation
      properties:
        fullName:
          type:
            - string
            - 'null'
        email:
          type: string
          format: email
          maxLength: 254
          description: Deve ser único — validado contra a tabela users.
        password:
          type: string
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
    UsernameAvailabilityResponse:
      type: object
      properties:
        data:
          type: object
          required:
            - available
            - username
            - suggestions
          properties:
            available:
              type: boolean
            username:
              type: string
            suggestions:
              type: array
              items:
                type: string
              description: Até 3 variações livres, presente só quando available é false.
    UpdateProfileRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados. Apenas
        `biography` aceita `null` (ou string vazia) para ser limpo; `null` em
        `fullName`, `username` ou `profilePictureId` é ignorado.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-z0-9_]+$
        biography:
          type:
            - string
            - 'null'
          maxLength: 70
        profilePictureId:
          type: string
          format: uuid
    AccountProfileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
            missionary:
              type: [object, 'null']
              description: Perfil missionário do usuário; null quando ele não é missionário.
            workAddress:
              type: [object, 'null']
              description: Endereço de atuação do missionário; null quando não cadastrado.
            missionaryAgency:
              description: >-
                Agência missionária vinculada (id e nome), para exibir o nome sem
                consultar o catálogo público, que tem rate limit por IP. Null
                quando o usuário não é missionário.
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'
            faithCommunity:
              description: >-
                Comunidade de fé vinculada (id e nome). Null quando o usuário não
                é missionário ou não informou comunidade.
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'

    CatalogReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    UserProfileResponse:
      type: object
      properties:
        data:
          type: object
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - newPasswordConfirmation
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
    RegisterMediaAssetRequest:
      type: object
      required:
        - bucket
        - fileKey
        - mimeType
        - fileSizeBytes
      properties:
        provider:
          type: string
          enum:
            - S3
            - R2
            - GCS
            - AZURE
        bucket:
          type: string
          maxLength: 255
        fileKey:
          type: string
          maxLength: 1024
        mimeType:
          type: string
          maxLength: 255
        fileSizeBytes:
          type: integer
          minimum: 1
    MediaAssetResponse:
      type: object
      properties:
        data:
          type: object
    UpdateMissionaryAboutRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados; `null` ou string
        vazia limpa o campo.
      properties:
        aboutMe:
          type:
            - string
            - 'null'
          maxLength: 5000
        missionStorySummary:
          type:
            - string
            - 'null'
          maxLength: 5000
        originLocation:
          type:
            - string
            - 'null'
          maxLength: 255
        faithCommunityId:
          type:
            - string
            - 'null'
          format: uuid
        prayerRequest:
          type:
            - string
            - 'null'
          maxLength: 5000
        lifeVerse:
          type:
            - string
            - 'null'
          maxLength: 255
    MissionaryResponse:
      type: object
      properties:
        data:
          type: object
    CreateMissionaryProfileRequest:
      type: object
      required:
        - missionaryAgencyId
      properties:
        missionaryAgencyId:
          type: string
          format: uuid
    UpdateMissionaryProfileRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados; `null` ou string
        vazia limpa o campo.
      properties:
        publicEmail:
          type:
            - string
            - 'null'
          format: email
        publicPhone:
          type:
            - string
            - 'null'
          example: '+5511912345678'
        publicPhoneIsWhatsapp:
          type: boolean
          description: Indica se o telefone público aceita WhatsApp; o perfil só oferece WhatsApp quando true.
        donationMessage:
          type:
            - string
            - 'null'
          maxLength: 5000
    UpdateMissionaryIdentityRequest:
      type: object
      required:
        - identityType
        - identityDocument
      properties:
        identityType:
          type: string
          enum:
            - CPF
            - PASSPORT
        identityDocument:
          type: string
          maxLength: 50
    UpdateMissionaryWorkAddressRequest:
      type: object
      required:
        - zip
        - district
        - city
        - state
        - country
      properties:
        zip:
          type: string
          maxLength: 20
        district:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        state:
          type: string
          maxLength: 255
        country:
          type: string
          maxLength: 255
    MissionaryWorkAddressResponse:
      type: object
      properties:
        data:
          type: object
    MissionaryAgency:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneNumber:
          type:
