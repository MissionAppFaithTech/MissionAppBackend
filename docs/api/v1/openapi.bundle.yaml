  /missionary-agencies:
    get:
      operationId: missionaryAgencyIndex
      tags:
        - missionary
      summary: Lista agências missionárias
      description: >-
        Consulta pública (sem autenticação) usada pelo cadastro de missionário
        para escolher agências missionárias antes de a conta existir. Limitada a 20
        requisições por janela de 60 segundos por IP; pedidos do servidor do BFF sem IP de
        usuário (busca cacheada no Next, ADR-0041) têm cota própria de 600/min.
      security: []
      parameters:
        - name: search
          in: query
          required: false
          description: >-
            Busca pelo nome da agência sem diferenciar maiúsculas nem acentos (ADR-0041).
            Com 2 caracteres, nomes que começam com o termo. Com 3 ou mais, tolerante a
            erros (ADR-0042): cada palavra (até 5) precisa casar com o nome, em qualquer
            ordem, por trecho, semelhança (pg_trgm, nota ≥ 0,45) ou até 1–2 letras
            erradas; primeiro os que começam com o termo, depois os que o contêm, depois
            os mais parecidos.
          schema:
            type: string
            minLength: 2
            maxLength: 255
        - name: limit
          in: query
          required: false
          description: Quantidade máxima de itens (padrão 10, máximo 20, NF 2.3). `meta.hasMore` diz se há mais; refine o termo em vez de paginar.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: city
          in: query
          required: false
          description: Filtra por cidade (busca parcial).
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: state
          in: query
          required: false
          description: Filtra por estado/província (busca parcial).
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: country
          in: query
          required: false
          description: Filtra por país (busca parcial).
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '200':
          description: Lista de agências missionárias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryAgenciesResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de consultas por IP excedido. Códigos: `E_TOO_MANY_REQUESTS`.
          headers:
            Retry-After:
              description: Segundos até a janela do rate limit expirar.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: missionaryAgencyStore
      tags:
        - missionary
      summary: Cria agência missionária
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionaryAgencyRequest'
      responses:
        '200':
          description: Agência missionária criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryAgencyResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação do corpo da requisição. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
