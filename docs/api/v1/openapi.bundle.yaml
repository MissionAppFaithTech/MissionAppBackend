          in: query
          required: false
          description: Busca parcial (sem diferenciar maiúsculas) pelo título do projeto.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: missionaryId
          in: query
          required: false
          description: Filtra pelo missionário dono do projeto.
          schema:
            type: string
            format: uuid
