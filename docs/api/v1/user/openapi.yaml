# Arquivo de agrupamento da pasta user/ (ADR-0027). Não contém paths nem
# schemas próprios — apenas $refs para os arquivos de conteúdo desta pasta.
# É este arquivo que o openapi.yaml raiz referencia.
paths:
  /accounts:
    $ref: './user.openapi.yaml#/paths/~1accounts'
  /accounts/missionaries:
    $ref: './user.openapi.yaml#/paths/~1accounts~1missionaries'
  /accounts/username-availability:
    $ref: './user.openapi.yaml#/paths/~1accounts~1username-availability'
  /account/profile:
    $ref: './user.openapi.yaml#/paths/~1account~1profile'
  /account/password:
    $ref: './user.openapi.yaml#/paths/~1account~1password'
  /media-assets:
    $ref: './user.openapi.yaml#/paths/~1media-assets'
  /users/{id}/follow:
    $ref: './user.openapi.yaml#/paths/~1users~1{id}~1follow'
  /users/{id}/followers:
    $ref: './user.openapi.yaml#/paths/~1users~1{id}~1followers'
  /users/{id}/following:
    $ref: './user.openapi.yaml#/paths/~1users~1{id}~1following'
