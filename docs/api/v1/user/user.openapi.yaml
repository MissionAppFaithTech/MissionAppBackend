paths:
  /accounts:
    post:
      operationId: accountSignup
      tags: [user]
      summary: Cadastro de conta
      description: >-
        Cria um novo usuário e emite o par de tokens de autenticação, sempre
        no corpo da resposta — mesmo fluxo de entrega do login (ver ADR-0023).
      security: []
      parameters:
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/ClientType'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/DeviceName'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/DeviceId'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/DeviceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Conta criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/LoginResponse'
        '422':
          description: >-
            Erro de validação (ex: email já em uso, senhas não conferem).
            Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /accounts/missionaries:
    post:
      operationId: accountMissionarySignup
      tags: [user]
      summary: Cadastro de missionário
      description: >-
        Cria, numa única transação, a conta já com role MISSIONARY e o perfil
        missionário, com os dados das três etapas do cadastro. Agência e
        comunidade de fé chegam como id de um item do catálogo ou como objeto
        para cadastrar um novo (registrado em nome do novo usuário; um item com
        o mesmo nome e cidade é reaproveitado). Qualquer falha desfaz tudo.
        Emite o par de tokens como o login (ADR-0023); o access token já sai
        com o role MISSIONARY. Rate limit de 10 cadastros por hora por IP.
      security: []
      parameters:
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/ClientType'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/DeviceName'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/DeviceId'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/DeviceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionarySignupRequest'
      responses:
        '200':
          description: Conta e perfil missionário criados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionarySignupResponse'
        '422':
          description: >-
            Erro de validação (ex.: e-mail ou username em uso, agência ausente
            ou inexistente, data de nascimento futura). Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de cadastros por IP atingido; veja `Retry-After`. Códigos:
            `E_TOO_MANY_REQUESTS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

  /accounts/username-availability:
    get:
      operationId: accountUsernameAvailability
      tags: [user]
      summary: Verifica disponibilidade de nome de usuário
      description: >-
        Consulta pública usada durante o cadastro, antes de a conta existir.
        Quando o username já está em uso, sugere até 3 variações com sufixo
        numérico que ainda estão livres.
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[a-z0-9_]+$'
      responses:
        '200':
          description: Resultado da checagem de disponibilidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'
        '422':
          description: >-
            Nome de usuário fora do formato esperado. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de requisições atingido; veja `Retry-After`. Códigos:
            `E_TOO_MANY_REQUESTS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

  /account/profile:
    get:
      operationId: accountProfileShow
      tags: [user]
      summary: Perfil do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
    patch:
      operationId: accountProfileUpdate
      tags: [user]
      summary: Atualiza perfil do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação dos campos de perfil. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /media-assets:
    post:
      operationId: mediaAssetStore
      tags: [user]
      summary: Registra metadata de um arquivo enviado ao storage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMediaAssetRequest'
      responses:
        '200':
          description: Media asset registrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /account/email:
    patch:
      operationId: accountEmailUpdate
      tags: [user]
      summary: Troca de e-mail de login
      description: >-
        Valida a senha atual e atualiza o e-mail de acesso do usuário autenticado,
        garantindo que o novo endereço seja diferente do atual e único na plataforma.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: E-mail atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Senha atual incorreta, novo e-mail igual ao atual ou já em uso. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /account/password:
    patch:
      operationId: accountPasswordUpdate
      tags: [user]
      summary: Troca de senha
      description: >-
        Valida a senha atual, atualiza o hash e dispara revogação global:
        incrementa o auth_version do usuário (invalidando todos os access
        tokens ativos, incluindo o da própria requisição na próxima chamada)
        e revoga todos os refresh tokens. Ver ADR-0023.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada com sucesso.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/MessageResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Senha atual incorreta, ou nova senha/confirmação inválidas. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /users/{id}/follow:
    get:
      operationId: userFollowShow
      tags: [user]
      summary: Informa se o usuário logado segue o perfil
      description: >-
        Estado do follow para quem está logado. Fica fora do perfil público,
        que é cacheado e compartilhado entre visitantes (ADR-0036). Só
        missionários públicos podem ser seguidos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado do follow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStateResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos: `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Usuário inexistente ou que não é missionário público. Códigos: `E_USER_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            O `id` informado não é um UUID válido. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

    post:
      operationId: userFollowStore
      tags: [user]
      summary: Segue um missionário
      description: >-
        Idempotente: seguir de novo não duplica a relação nem o contador.
        Qualquer usuário autenticado pode seguir; só missionários públicos
        (aprovados, ativos) podem ser seguidos, o que impede apoiador de
        seguir apoiador. Os contadores são eventualmente consistentes (ADR-0033): a relação é
        gravada na hora e o contador recebe um delta no cache, aplicado no
        banco em lote; a resposta já soma os deltas pendentes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Perfil seguido (ou já era seguido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStateResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos: `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Usuário inexistente ou que não é missionário público. Códigos: `E_USER_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            O `id` não é um UUID válido ou é o próprio usuário. Códigos: `E_VALIDATION_ERROR`, `E_CANNOT_FOLLOW_SELF`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Mais de 120 ações de seguir/curtir por minuto para o mesmo usuário. Códigos: `E_TOO_MANY_REQUESTS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

    delete:
      operationId: userFollowDestroy
      tags: [user]
      summary: Deixa de seguir um usuário
      description: >-
        Idempotente. Não exige que o perfil ainda seja público, para permitir
        deixar de seguir um perfil desativado. Os contadores são eventualmente consistentes (ADR-0033): a relação é
        gravada na hora e o contador recebe um delta no cache, aplicado no
        banco em lote; a resposta já soma os deltas pendentes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Perfil deixou de ser seguido (ou já não era).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStateResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos: `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Usuário inexistente. Códigos: `E_USER_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            O `id` informado não é um UUID válido. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Mais de 120 ações de seguir/curtir por minuto para o mesmo usuário. Códigos: `E_TOO_MANY_REQUESTS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

  /users/{id}/followers:
    get:
      operationId: userFollowersIndex
      tags: [user]
      summary: Lista os seguidores de um usuário por cursor
      description: >-
        Quem seguiu mais recentemente primeiro (ADR-0033). Contas removidas ou
        inativas ficam fora da lista. O total vem de `followersCount` no
        perfil, não da lista.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/CursorParam'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: Página de seguidores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowersResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos: `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Usuário inexistente, removido ou inativo. Códigos: `E_USER_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Parâmetro inválido ou cursor malformado. Códigos: `E_VALIDATION_ERROR`, `E_INVALID_CURSOR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /users/{id}/following:
    get:
      operationId: userFollowingIndex
      tags: [user]
      summary: Lista quem um usuário segue por cursor
      description: >-
        Seguido mais recentemente primeiro (ADR-0033). Contas removidas ou
        inativas ficam fora da lista.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/CursorParam'
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: Página de perfis seguidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowingResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos: `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Usuário inexistente, removido ou inativo. Códigos: `E_USER_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Parâmetro inválido ou cursor malformado. Códigos: `E_VALIDATION_ERROR`, `E_INVALID_CURSOR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Id do usuário (o `id` do perfil público de missionário).
      schema:
        type: string
        format: uuid

  schemas:
    SignupRequest:
      type: object
      required: [email, password, passwordConfirmation]
      properties:
        fullName:
          type: [string, 'null']
        email:
          type: string
          format: email
          maxLength: 254
          description: Deve ser único — validado contra a tabela users.
        password:
          type: string
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 32

    MissionarySignupRequest:
      type: object
      required:
        [fullName, username, phoneNumber, gender, email, password, passwordConfirmation, birthDate]
      description: >-
        Informe a agência por `missionaryAgencyId` ou por `missionaryAgency`
        (exatamente um) e, opcionalmente, a comunidade por `faithCommunityId`
        ou por `faithCommunity` (no máximo um).
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-z0-9_]+$'
        phoneNumber:
          type: string
          pattern: '^\\+[1-9]\\d{1,14}$'
        gender:
          type: string
          enum: [MALE, FEMALE]
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 32
        birthDate:
          type: string
          format: date
          description: Data passada no formato AAAA-MM-DD.
        identityType:
          type: string
          enum: [CPF, PASSPORT]
          description: Obrigatório junto com `identityDocument`.
        identityDocument:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Obrigatório junto com `identityType`. Salvo normalizado: CPF só com dígitos
            (11), passaporte em maiúsculas só com letras e números. Único por tipo:
            repetido responde 422 neste campo ("Este CPF já está cadastrado.").
        aboutMe:
          type: string
          maxLength: 5000
          description: Texto da seção Sobre (projeto ou atuação missionária).
        missionaryAgencyId:
          type: string
          format: uuid
        missionaryAgency:
          $ref: '../missionary/missionary.openapi.yaml#/components/schemas/CreateMissionaryAgencyRequest'
        faithCommunityId:
          type: string
          format: uuid
        faithCommunity:
          $ref: '../missionary/missionary.openapi.yaml#/components/schemas/CreateFaithCommunityRequest'

    MissionarySignupResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '../auth/auth.openapi.yaml#/components/schemas/UserSummary'
            missionary:
              type: object
            workAddress:
              type: 'null'
              description: Sempre null no cadastro; o local de atuação é informado depois.
            missionaryAgency:
              $ref: '#/components/schemas/CatalogReference'
            faithCommunity:
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'
            accessToken:
              type: string
            refreshToken:
              type: string

    ChangeEmailRequest:
      type: object
      required: [email, currentPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        currentPassword:
          type: string

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
          minLength: 8
          maxLength: 32

    UpdateProfileRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados. `biography` e
        `profilePictureId` aceitam `null` (ou string vazia) para ser limpos;
        `null` em `fullName` ou `username` é ignorado.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-z0-9_]+$'
        biography:
          type: [string, 'null']
          maxLength: 70
        profilePictureId:
          type: [string, 'null']
          format: uuid
          description: >-
            Asset `PROFILE_PICTURE` enviado pelo próprio usuário com upload
            confirmado (`POST /media-assets/uploads` e
            `POST /media-assets/{id}/completion`); caso contrário, 422 em
            `profilePictureId`. A foto anterior é removida do storage depois da
            troca ou da remoção.
        faithCommunityId:
          type: [string, 'null']
          format: uuid
          description: >-
            Comunidade de fé vinculada à conta; `null` desvincula.

    UsernameAvailabilityResponse:
      type: object
      properties:
        data:
          type: object
          required: [available, username, suggestions]
          properties:
            available:
              type: boolean
            username:
              type: string
            suggestions:
              type: array
              items:
                type: string
              description: Até 3 variações livres quando available é false; caso contrário, retorna um array vazio.

    AccountProfileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '../auth/auth.openapi.yaml#/components/schemas/UserSummary'
            missionary:
              type: [object, 'null']
              description: Perfil missionário do usuário; null quando ele não é missionário.
            workAddress:
              type: [object, 'null']
              description: Endereço de atuação do missionário; null quando não cadastrado.
            missionaryAgency:
              description: >-
                Agência missionária vinculada (id e nome), para exibir o nome sem
                consultar o catálogo público, que tem rate limit por IP. Null
                quando o usuário não é missionário.
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'
            faithCommunity:
              description: >-
                Comunidade de fé vinculada (id e nome). Null quando o usuário não
                é missionário ou não informou comunidade.
              oneOf:
                - $ref: '#/components/schemas/CatalogReference'
                - type: 'null'

    CatalogReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    UserProfileResponse:
      type: object
      properties:
        data:
          type: object

    RegisterMediaAssetRequest:
