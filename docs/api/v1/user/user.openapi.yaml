paths:
  /accounts:
    post:
      operationId: accountSignup
      tags: [user]
      summary: Cadastro de conta
      description: >-
        Cria um novo usuário e emite o par de tokens de autenticação, sempre
        no corpo da resposta — mesmo fluxo de entrega do login (ver ADR-0023).
      security: []
      parameters:
        - $ref: '../auth/auth.openapi.yaml#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Conta criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/LoginResponse'
        '422':
          description: 'Erro de validação (ex: email já em uso, senhas não conferem).'
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /accounts/username-availability:
    get:
      operationId: accountUsernameAvailability
      tags: [user]
      summary: Verifica disponibilidade de nome de usuário
      description: >-
        Consulta pública usada durante o cadastro, antes de a conta existir.
        Quando o username já está em uso, sugere até 3 variações com sufixo
        numérico que ainda estão livres.
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[a-z0-9_]+$'
      responses:
        '200':
          description: Resultado da checagem de disponibilidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'
        '422':
          description: Nome de usuário fora do formato esperado.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /account/profile:
    get:
      operationId: accountProfileShow
      tags: [user]
      summary: Perfil do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../auth/auth.openapi.yaml#/components/schemas/UserSummary'
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
    patch:
      operationId: accountProfileUpdate
      tags: [user]
      summary: Atualiza perfil do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '422':
          description: Erro de validação dos campos de perfil.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /account:
    delete:
      operationId: accountDestroy
      tags: [user]
      summary: Encerra a conta do usuário autenticado
      description: >-
        RF 15.5. Apoiadores são excluídos permanentemente; missionários
        recebem exclusão lógica (`deletedAt`), preservando conteúdo já
        publicado. Em ambos os casos todas as sessões ativas são revogadas.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Conta encerrada com sucesso.
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

  /media-assets:
    post:
      operationId: mediaAssetStore
      tags: [user]
      summary: Registra metadata de um arquivo enviado ao storage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMediaAssetRequest'
      responses:
        '200':
          description: Media asset registrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'

  /account/password:
    patch:
      operationId: accountPasswordUpdate
      tags: [user]
      summary: Troca de senha
      description: >-
        Valida a senha atual, atualiza o hash e dispara revogação global:
        incrementa o auth_version do usuário (invalidando todos os access
        tokens ativos, incluindo o da própria requisição na próxima chamada)
        e revoga todos os refresh tokens. Ver ADR-0023.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada com sucesso.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/MessageResponse'
        '401':
          description: Access token ausente, inválido ou revogado.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: Senha atual incorreta, ou nova senha/confirmação inválidas.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

components:
  schemas:
    SignupRequest:
      type: object
      required: [email, password, passwordConfirmation]
      properties:
        fullName:
          type: [string, 'null']
        email:
          type: string
          format: email
          maxLength: 254
          description: Deve ser único — validado contra a tabela users.
        password:
          type: string
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          minLength: 8
          maxLength: 32

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 32
        newPasswordConfirmation:
          type: string
          minLength: 8
          maxLength: 32

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-z0-9_]+$'
        biography:
          type: string
          maxLength: 200
        profilePictureId:
          type: string
          format: uuid
        faithCommunityId:
          type: string
          format: uuid
          description: >-
            Comunidade de fé associada ao perfil (RF 11.5). Deve existir em
            `faith_communities`; campo opcional, omitido não altera o valor atual.

    UsernameAvailabilityResponse:
      type: object
      properties:
        data:
          type: object
          required: [available, username, suggestions]
          properties:
            available:
              type: boolean
            username:
              type: string
            suggestions:
              type: array
              items:
                type: string
              description: Até 3 variações livres quando available é false; caso contrário, retorna um array vazio.

    UserProfileResponse:
      type: object
      properties:
        data:
          type: object

    RegisterMediaAssetRequest:
      type: object
      required: [bucket, fileKey, mimeType, fileSizeBytes]
      properties:
        provider:
          type: string
          enum: [S3, R2, GCS, AZURE]
        bucket:
          type: string
          maxLength: 255
        fileKey:
          type: string
          maxLength: 1024
        mimeType:
          type: string
          maxLength: 255
        fileSizeBytes:
          type: integer
          minimum: 1

    MediaAssetResponse:
      type: object
      properties:
        data:
          type: object
