              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Usuário sem permissão para remover a agência. Códigos:
            `E_MISSIONARY_AGENCY_FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Agência missionária não encontrada. Códigos:
            `E_MISSIONARY_AGENCY_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Agência com missionários vinculados; nada foi excluído. Códigos:
