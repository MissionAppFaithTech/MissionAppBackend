paths:
  /missionaries/about:
    patch:
      operationId: missionaryAboutUpdate
      tags: [missionary]
      summary: Atualiza seção sobre do missionário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryAboutRequest'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryAboutResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Perfil sem permissão para editar dados missionários. Códigos:
            `E_MISSIONARY_PROFILE_FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Usuário missionário ainda sem perfil missionário. Códigos:
            `E_MISSIONARY_PROFILE_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /missionaries/profile:
    post:
      operationId: missionaryProfileStore
      tags: [missionary]
      summary: Converte usuário autenticado para missionário
      description: >-
        Cria o perfil missionário para o usuário autenticado e altera seu role
        para MISSIONARY. Requer nova autenticação após a conversão para que os
        novos claims de role sejam refletidos no JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionaryProfileRequest'
      responses:
        '200':
          description: Perfil missionário criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  missionary:
                    $ref: '#/components/schemas/MissionaryResponse'
                  message:
                    type: string
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Role sem permissão para conversão. Códigos:
            `E_MISSIONARY_PROFILE_FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Agência missionária informada não encontrada. Códigos:
            `E_MISSIONARY_AGENCY_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Usuário já possui perfil missionário. Códigos:
            `E_MISSIONARY_PROFILE_ALREADY_EXISTS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação do corpo da requisição. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

    patch:
      operationId: missionaryProfileUpdate
      tags: [missionary]
      summary: Atualiza contatos públicos do missionário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionaryProfileRequest'
      responses:
        '200':
          description: Dados públicos atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionaryResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Usuário sem papel de missionário (ou administrador) para editar este
            perfil. Códigos: `E_MISSIONARY_PROFILE_FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Usuário missionário ainda sem perfil missionário. Códigos:
            `E_MISSIONARY_PROFILE_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

