        Consulta pública (sem autenticação) usada pelo cadastro de missionário
        para escolher comunidades de fé antes de a conta existir. Limitada a 20
        requisições por janela de 60 segundos por IP; pedidos do servidor do BFF sem IP de
        usuário (busca cacheada no Next, ADR-0041) têm cota própria de 600/min.
      security: []
      parameters:
        - name: search
          in: query
          required: false
          description: >-
            Busca pelo nome da comunidade de fé sem diferenciar maiúsculas nem acentos (ADR-0041).
            Com 2 caracteres, nomes que começam com o termo. Com 3 ou mais, tolerante a
            erros (ADR-0042): cada palavra (até 5) precisa casar com o nome, em qualquer
            ordem, por trecho, semelhança (pg_trgm, nota ≥ 0,45) ou até 1–2 letras
            erradas; primeiro os que começam com o termo, depois os que o contêm, depois
            os mais parecidos.
          schema:
            type: string
            minLength: 2
            maxLength: 255
        - name: limit
          in: query
          required: false
          description: Quantidade máxima de itens (padrão 10, máximo 20, NF 2.3). `meta.hasMore` diz se há mais; refine o termo em vez de paginar.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: city
          in: query
          required: false
          description: Filtra por cidade (busca parcial).
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: state
          in: query
          required: false
          description: Filtra por estado/província (busca parcial).
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: country
          in: query
          required: false
          description: Filtra por país (busca parcial).
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '200':
          description: Lista de comunidades de fé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaithCommunitiesResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de consultas por IP excedido. Códigos: `E_TOO_MANY_REQUESTS`.
          headers:
            Retry-After:
              description: Segundos até a janela do rate limit expirar.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

    post:
      operationId: faithCommunityStore
      tags: [missionary]
      summary: Cria comunidade de fé
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFaithCommunityRequest'
      responses:
        '200':
          description: Comunidade de fé criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaithCommunityResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação do corpo da requisição. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /faith-communities/{id}:
    get:
      operationId: faithCommunityShow
      tags: [missionary]
      summary: Exibe uma comunidade de fé
      description: >-
        Consulta pública (sem autenticação) usada pelo cadastro de missionário
        para escolher comunidades de fé antes de a conta existir. Limitada a 20
        requisições por janela de 60 segundos por IP.
      security: []
      parameters:
        - $ref: '#/components/parameters/FaithCommunityId'
      responses:
        '200':
          description: Comunidade de fé encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaithCommunityResponse'
        '404':
          description: >-
            Comunidade de fé não encontrada. Códigos:
            `E_FAITH_COMMUNITY_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de consultas por IP excedido. Códigos: `E_TOO_MANY_REQUESTS`.
          headers:
            Retry-After:
              description: Segundos até a janela do rate limit expirar.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

    patch:
      operationId: faithCommunityUpdate
      tags: [missionary]
      summary: Atualiza uma comunidade de fé
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FaithCommunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFaithCommunityRequest'
      responses:
        '200':
          description: Comunidade de fé atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaithCommunityResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Usuário sem permissão para atualizar a comunidade. Códigos:
            `E_FAITH_COMMUNITY_FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Comunidade de fé não encontrada. Códigos:
            `E_FAITH_COMMUNITY_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação do corpo da requisição. Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

    delete:
      operationId: faithCommunityDestroy
      tags: [missionary]
      summary: Remove uma comunidade de fé
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FaithCommunityId'
      responses:
        '200':
          description: Comunidade de fé removida com sucesso.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/MessageResponse'
        '401':
          description: >-
            Access token ausente, inválido ou revogado. Códigos:
            `E_UNAUTHORIZED_ACCESS`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Usuário sem permissão para remover a comunidade. Códigos:
            `E_FAITH_COMMUNITY_FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            Comunidade de fé não encontrada. Códigos:
            `E_FAITH_COMMUNITY_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Erro de validação da requisição. Códigos: `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'

  /public/missionaries/{username}:
    get:
      operationId: publicMissionaryProfileShow
      tags: [missionary]
      summary: Perfil público de missionário
      description: >-
        Consulta anônima, só leitura (RF 1.4, RF 10). Devolve apenas os campos
        públicos aprovados (ADR-0036): identificação, agência, comunidade de fé,
        aba Sobre, local de atuação (cidade/estado/país), contadores e contato
        público. Só missionários com perfil aprovado e conta ativa são visíveis;
        os demais respondem o mesmo 404. Rate limit de 60 consultas por minuto
        por IP; o servidor do BFF sem IP de usuário (renderização pública com
        cache) tem orçamento próprio de 600 por minuto.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          description: Username do missionário (maiúsculas são aceitas e normalizadas).
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[A-Za-z0-9_]+$'
      responses:
        '200':
          description: Perfil público encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMissionaryProfileResponse'
        '404':
          description: >-
            Perfil inexistente ou não público
            (`E_MISSIONARY_PROFILE_NOT_FOUND`). Códigos:
            `E_MISSIONARY_PROFILE_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Username com formato inválido (`E_VALIDATION_ERROR`). Códigos:
            `E_VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ValidationErrorResponse'
        '429':
          description: >-
            Limite de consultas excedido (`E_TOO_MANY_REQUESTS`). Códigos:
            `E_TOO_MANY_REQUESTS`.
          headers:
            Retry-After:
              description: Segundos até a janela do rate limit expirar.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '../auth/auth.openapi.yaml#/components/schemas/ErrorResponse'

components:
  parameters:
    MissionaryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    MissionaryAgencyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FaithCommunityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateMissionaryProfileRequest:
      type: object
      required: [missionaryAgencyId]
      properties:
        missionaryAgencyId:
          type: string
          format: uuid

    MissionaryResponse:
      type: object
      properties:
        data:
          type: object

    MissionaryWorkAddressResponse:
      type: object
      properties:
        data:
          type: object

    MissionaryAboutResponse:
      type: object
      description: Mesmo formato do perfil missionário em `GET /account/profile`.
      properties:
        data:
          type: object
          properties:
            missionary:
              type: object
            workAddress:
              type: [object, 'null']
              description: Local de atuação; null quando não cadastrado.
            missionaryAgency:
              $ref: '../user/user.openapi.yaml#/components/schemas/CatalogReference'
            faithCommunity:
              oneOf:
                - $ref: '../user/user.openapi.yaml#/components/schemas/CatalogReference'
                - type: 'null'

    MissionaryAgency:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneNumber:
          type: [string, 'null']
        addressLine1:
          type: [string, 'null']
        addressLine2:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        country:
          type: [string, 'null']
        postalCode:
          type: [string, 'null']
        website:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    MissionaryAgencyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            missionaryAgency:
              $ref: '#/components/schemas/MissionaryAgency'

    MissionaryAgenciesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            missionaryAgencies:
              type: array
              items:
                $ref: '#/components/schemas/MissionaryAgency'
        meta:
          type: object
          required: [hasMore]
          properties:
            hasMore:
              type: boolean
              description: Há mais itens além do `limit` para este termo.

    CreateMissionaryAgencyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: '^\\+[1-9]\\d{1,14}$'
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          minLength: 1
          maxLength: 255
        country:
          type: string
          minLength: 1
          maxLength: 255
        postalCode:
          type: string
          minLength: 1
          maxLength: 32
        website:
          type: string
          format: uri
          maxLength: 255

    UpdateMissionaryAgencyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: '^\\+[1-9]\\d{1,14}$'
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          minLength: 1
          maxLength: 255
        country:
          type: string
          minLength: 1
          maxLength: 255
        postalCode:
          type: string
          minLength: 1
          maxLength: 32
        website:
          type: string
          format: uri
          maxLength: 255

    FaithCommunity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneNumber:
          type: [string, 'null']
        addressLine1:
          type: [string, 'null']
        addressLine2:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        country:
          type: [string, 'null']
        postalCode:
          type: [string, 'null']
        website:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        pastorName:
          type: [string, 'null']
          description: Nome do pastor responsável (um por comunidade).
        pastorPhone:
          type: [string, 'null']
          description: Telefone do pastor em E.164.

    FaithCommunityResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            faithCommunity:
              $ref: '#/components/schemas/FaithCommunity'

    FaithCommunitiesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            faithCommunities:
              type: array
              items:
                $ref: '#/components/schemas/FaithCommunity'
        meta:
          type: object
          required: [hasMore]
          properties:
            hasMore:
              type: boolean
              description: Há mais itens além do `limit` para este termo.

    CreateFaithCommunityRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: '^\\+[1-9]\\d{1,14}$'
        pastorName:
          type: string
          minLength: 1
          maxLength: 255
          description: Obrigatório quando `pastorPhone` é enviado.
        pastorPhone:
          type: string
          pattern: '^\\+[1-9]\\d{1,14}$'
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          minLength: 1
          maxLength: 255
        country:
          type: string
          minLength: 1
          maxLength: 255
        postalCode:
          type: string
          minLength: 1
          maxLength: 32
        website:
          type: string
          format: uri
          maxLength: 255

    UpdateFaithCommunityRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          pattern: '^\\+[1-9]\\d{1,14}$'
        pastorName:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
          description: >-
            `null` remove o pastor. Sem pastor cadastrado, é obrigatório junto
            com `pastorPhone` (422 em `pastorName`).
        pastorPhone:
          type: [string, 'null']
          pattern: '^\\+[1-9]\\d{1,14}$'
          description: '`null` limpa só o telefone.'
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          minLength: 1
          maxLength: 255
        country:
          type: string
          minLength: 1
          maxLength: 255
        postalCode:
          type: string
          minLength: 1
          maxLength: 32
        website:
          type: string
          format: uri
          maxLength: 255

    UpdateMissionaryAboutRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados; `null` ou string
        vazia limpa o campo.
      properties:
        aboutMe:
          type: [string, 'null']
          maxLength: 5000
        missionStorySummary:
          type: [string, 'null']
          maxLength: 5000
        originLocation:
          type: [string, 'null']
          maxLength: 255
        faithCommunityId:
          type: [string, 'null']
          format: uuid
        missionaryAgencyId:
          type: string
          format: uuid
          description: Troca a agência missionária; não aceita limpar (`null` é ignorado).
        workAddress:
          description: >-
            Local de atuação. Substitui o endereço inteiro, com todos os campos
            obrigatórios (mesmas regras de `PATCH /missionaries/work-address`).
          allOf:
            - $ref: '#/components/schemas/UpdateMissionaryWorkAddressRequest'
        prayerRequest:
          type: [string, 'null']
          maxLength: 5000
        lifeVerse:
          type: [string, 'null']
          maxLength: 255

    UpdateMissionaryProfileRequest:
      type: object
      description: >-
        Atualização parcial: campos omitidos não são alterados; `null` ou string
        vazia limpa o campo.
      properties:
        publicEmail:
          type: [string, 'null']
          format: email
        publicPhone:
          type: [string, 'null']
          example: '+5511912345678'
        publicPhoneIsWhatsapp:
          type: boolean
          description: Indica se o telefone público aceita WhatsApp; o perfil só oferece WhatsApp quando true.
        donationMessage:
          type: [string, 'null']
          maxLength: 5000

    UpdateMissionaryIdentityRequest:
      type: object
      required: [identityType, identityDocument]
      properties:
        identityType:
          type: string
          enum: [CPF, PASSPORT]
        identityDocument:
          type: string
          maxLength: 50
          description: >-
            Salvo normalizado: CPF só com dígitos (11), passaporte em maiúsculas só com
            letras e números. Não pode ser o documento de outro missionário: responde 422
            neste campo ("Este CPF já está cadastrado.").

    UpdateMissionaryWorkAddressRequest:
      type: object
      required: [zip, district, city, state, country]
      properties:
        zip:
          type: string
          maxLength: 20
        district:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        state:
          type: string
          maxLength: 255
        country:
          type: string
          maxLength: 255

    PublicMissionaryProfile:
      type: object
      description: Campos públicos do perfil de missionário (ADR-0036). Nunca inclui PII.
      required:
        [
          username,
          fullName,
          biography,
          profilePictureUrl,
          role,
          missionaryAgency,
          faithCommunity,
          about,
          workLocation,
          followersCount,
          followingCount,
          contact,
        ]
      properties:
        username:
          type: string
        fullName:
          type: string
        biography:
          type: string
          nullable: true
        profilePictureUrl:
          type: string
          format: uri
          nullable: true
          description: URL pública da foto de perfil; null sem foto ou em processamento.
        role:
          type: string
          enum: [MISSIONARY]
        missionaryAgency:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        faithCommunity:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        about:
          type: object
          properties:
            aboutMe:
              type: string
              nullable: true
            missionStorySummary:
              type: string
              nullable: true
            originLocation:
              type: string
              nullable: true
            prayerRequest:
              type: string
              nullable: true
            lifeVerse:
              type: string
              nullable: true
        workLocation:
          type: object
          nullable: true
          properties:
            city:
              type: string
            state:
              type: string
            country:
              type: string
        followersCount:
          type: integer
        followingCount:
          type: integer
        contact:
          type: object
          properties:
            publicEmail:
              type: string
              nullable: true
            publicPhone:
              type: string
              nullable: true
            publicPhoneIsWhatsapp:
              type: boolean

    PublicMissionaryProfileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            missionary:
              $ref: '#/components/schemas/PublicMissionaryProfile'
