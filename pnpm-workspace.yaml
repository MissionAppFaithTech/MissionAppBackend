allowBuilds:
  '@swc/core': true
  argon2: true
  better-sqlite3: true
  msgpackr-extract: false
  unrs-resolver: false
patchedDependencies:
  jsonschema@1.5.0: patches/jsonschema@1.5.0.patch
overrides:
  # WARNING: o @adonisjs/mail 10.4.0 ainda declara nodemailer ^9; as correções
  # dos advisories do addressparser e do cliente SMTP só existem no 10.x.
  # Validado com o transporte Resend — remover quando o Adonis suportar o 10.
  nodemailer: 10.6.0
  # NOTE: corrige advisories high/critical do Snyk em undici <7.30.2 (via @elastic/transport).
  undici: 7.30.2
  # NOTE: o @opentelemetry/core 2.x (via @elastic/transport) exige api <1.10.
  '@opentelemetry/api': 1.10.0
  # NOTE: corrige SNYK-JS-MSGPACKR-22744130 (high) no msgpackr 2.1.2 do bullmq 6.4.1.
  # TODO: remover ao atualizar o bullmq para >=6.7.1, que já traz o 2.1.4.
  msgpackr: 2.1.4
